[package]
name = "humany"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Human-readable formatting for Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/munafio/humany"
homepage = "https://github.com/munafio/humany"
authors = ["Munafio <info@munafio.com>"]
keywords = ["format", "human", "duration", "bytes", "locale"]
categories = ["localization", "value-formatting", "no-std"]
documentation = "https://docs.rs/humany"

[features]
default = ["std"]
std = []
chrono = ["std", "dep:chrono"]
time = ["std", "dep:time"]

[dependencies]
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }
time = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[[example]]
name = "basic"
required-features = ["std"]

[[example]]
name = "customization"
required-features = ["std"]
